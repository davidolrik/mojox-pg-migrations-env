name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: upload to PAUSE
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_ONLINE: postgresql://postgres:postgres@localhost:5432/postgres?search_path=mojox_pg_migrations_env_test
      AUTHOR_TESTING: "1"
    steps:
      # The whole history is fetched, so the tagged commit can be looked for on main
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The tag is peeled to its commit, which works whether the sha names the commit or an annotated tag
      - name: Check that the tag is on main
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}^{commit}" origin/main; then
            echo "Tag $GITHUB_REF_NAME is not on main, only tags on main are released" >&2
            exit 1
          fi
      - name: Check that the tag matches the module version
        run: |
          version=$(perl -MExtUtils::MakeMaker -e 'print MM->parse_version(shift)' lib/MojoX/Pg/Migrations/Env.pm)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match module version $version" >&2
            exit 1
          fi
      # DBD::Pg is built against the libpq headers
      - name: Install libpq headers
        run: sudo apt-get update && sudo apt-get install --yes libpq-dev
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.44"
          install-modules-with: cpanm
          install-modules-args: --with-configure --with-develop
      # Installed on its own, so only the dependencies it needs to run come with it
      - name: Install cpan-upload
        run: cpanm --notest CPAN::Uploader
      - run: perl Makefile.PL
      - name: Run the tests
        run: make test
      # The distribution holds the files listed in MANIFEST, which is kept in the repository
      - name: Build the distribution
        run: make dist
      - name: Upload to PAUSE
        env:
          PAUSE_USER: ${{ secrets.PAUSE_USER }}
          PAUSE_PASSWORD: ${{ secrets.PAUSE_PASSWORD }}
        run: |
          # cpan-upload reads the credentials from this file, which keeps them off the command line
          umask 077
          printf 'user %s\npassword %s\n' "$PAUSE_USER" "$PAUSE_PASSWORD" > "$HOME/.pause"
          cpan-upload MojoX-Pg-Migrations-Env-*.tar.gz
